<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Civil Maintenance Mall System</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background-color: #f4f6f9; }
    .card-report { margin-bottom: 15px; border-left: 5px solid #0d6efd; }
    .status-REPORTED { border-left-color: #dc3545; }
    .status-PROGRESS { border-left-color: #ffc107; }
    .status-RESOLVED { border-left-color: #198754; }
    .img-preview { width: 100%; max-height: 180px; object-fit: cover; border-radius: 5px; cursor: pointer; border: 1px solid #ddd; }
    .filter-btn-group .btn { font-size: 0.85rem; }
  </style>
</head>
<body>

<div class="container py-3" style="max-width: 600px;">

  <!-- FORM AUTENTIKASI (LOGIN / REGISTER / LUPA PASSWORD) -->
  <div id="authContainer">
    
    <!-- 1. LOGIN FORM -->
    <div id="loginCard" class="card p-4 shadow-sm">
      <h3 class="text-center mb-3">Login System Civil</h3>
      <form id="loginForm">
        <div class="mb-3">
          <label>Username</label>
          <input type="text" id="loginUser" class="form-control" required>
        </div>
        <div class="mb-3">
          <label>Password</label>
          <input type="password" id="loginPass" class="form-control" required>
        </div>
        <button type="submit" id="btnLogin" class="btn btn-primary w-100">Login</button>
      </form>
      <div class="d-flex justify-content-between mt-3 small">
        <a href="#" onclick="showAuthCard('registerCard')">Buat Akun Baru</a>
        <a href="#" onclick="showAuthCard('forgotCard')">Lupa Password?</a>
      </div>
    </div>

    <!-- 2. REGISTER FORM -->
    <div id="registerCard" class="card p-4 shadow-sm d-none">
      <h3 class="text-center mb-3">Buat Akun Baru</h3>
      <form id="registerForm">
        <div class="mb-3">
          <label>Nama Lengkap</label>
          <input type="text" id="regFullname" class="form-control" placeholder="Contoh: Vandi Tech" required>
        </div>
        <div class="mb-3">
          <label>Username</label>
          <input type="text" id="regUser" class="form-control" placeholder="Contoh: vandi_civil" required>
        </div>
        <div class="mb-3">
          <label>Password</label>
          <input type="password" id="regPass" class="form-control" required>
        </div>
        <button type="submit" id="btnRegister" class="btn btn-success w-100">Daftar Akun</button>
      </form>
      <div class="text-center mt-3 small">
        Sudah punya akun? <a href="#" onclick="showAuthCard('loginCard')">Login di sini</a>
      </div>
    </div>

    <!-- 3. FORGOT PASSWORD FORM -->
    <div id="forgotCard" class="card p-4 shadow-sm d-none">
      <h3 class="text-center mb-3">Reset Password</h3>
      <form id="forgotForm">
        <div class="mb-3">
          <label>Username Anda</label>
          <input type="text" id="forgotUser" class="form-control" required>
        </div>
        <div class="mb-3">
          <label>Password Baru</label>
          <input type="password" id="forgotNewPass" class="form-control" required>
        </div>
        <button type="submit" id="btnForgot" class="btn btn-warning w-100">Ubah Password</button>
      </form>
      <div class="text-center mt-3 small">
        Kembali ke <a href="#" onclick="showAuthCard('loginCard')">Halaman Login</a>
      </div>
    </div>

  </div>

  <!-- MAIN APP SECTION -->
  <div id="appSection" class="d-none">
    <div class="d-flex justify-content-between align-items-center mb-3">
      <span id="userGreeting" class="fw-bold"></span>
      <button onclick="logout()" class="btn btn-sm btn-outline-danger">Logout</button>
    </div>

    <!-- TAB NAVIGATION -->
    <ul class="nav nav-pills nav-justified mb-3">
      <li class="nav-item"><a class="nav-link active" id="tabList" onclick="switchTab('list')" href="#">Daftar Laporan</a></li>
      <li class="nav-item"><a class="nav-link" id="tabCreate" onclick="switchTab('create')" href="#">+ Buat Laporan</a></li>
    </ul>

    <!-- CREATE REPORT FORM -->
    <div id="createTab" class="card p-3 shadow-sm d-none">
      <h5>Lapor Kerusakan Civil</h5>
      <form id="reportForm">
        <div class="mb-2">
          <label>Lantai</label>
          <select id="floor" class="form-select" required>
            <option value="LG">LG</option>
            <option value="L1">L1</option>
            <option value="L2">L2</option>
            <option value="L3">L3</option>
            <option value="Rooftop">Rooftop</option>
          </select>
        </div>
        <div class="mb-2">
          <label>Zone</label>
          <select id="zone" class="form-select" required>
            <option value="Zone A">Zone A</option>
            <option value="Zone B">Zone B</option>
            <option value="Zone C">Zone C</option>
            <option value="Zone D">Zone D</option>
          </select>
        </div>
        <div class="mb-2">
          <label>Tipe Area</label>
          <select id="area_type" class="form-select" required>
            <option value="Public Area">Public Area</option>
            <option value="Service Area">Service Area</option>
          </select>
        </div>
        <div class="mb-2">
          <label>Detail Lokasi/Tenant</label>
          <input type="text" id="location_detail" class="form-control" placeholder="Contoh: Depan MO / Atrium" required>
        </div>
        <div class="mb-2">
          <label>Detail Kerusakan</label>
          <textarea id="issue" class="form-control" rows="2" required></textarea>
        </div>
        <div class="mb-3">
          <label>Sumber Foto</label>
          <div class="d-flex gap-2 mb-2">
            <button type="button" class="btn btn-outline-primary btn-sm w-50" onclick="triggerFileInput('camera')">📷 Buka Kamera</button>
            <button type="button" class="btn btn-outline-secondary btn-sm w-50" onclick="triggerFileInput('gallery')">🖼️ Pilih Galeri</button>
          </div>
          <input type="file" id="photoCamera" class="d-none" accept="image/*" capture="environment">
          <input type="file" id="photoGallery" class="d-none" accept="image/*">
          <small id="photoStatus" class="text-muted d-block"></small>
        </div>
        <button type="submit" id="btnSubmitReport" class="btn btn-success w-100">Kirim Laporan</button>
      </form>
    </div>

    <!-- REPORT LIST & FILTER -->
    <div id="listTab">
      <div class="card p-2 mb-3 shadow-sm">
        <div class="btn-group w-100 filter-btn-group" role="group">
          <button type="button" class="btn btn-primary active" id="btnFilterAll" onclick="setFilter('ALL')">Semua</button>
          <button type="button" class="btn btn-outline-danger" id="btnFilterReported" onclick="setFilter('REPORTED')">Reported</button>
          <button type="button" class="btn btn-outline-warning text-dark" id="btnFilterProgress" onclick="setFilter('PROGRESS')">Progress</button>
          <button type="button" class="btn btn-outline-success" id="btnFilterResolved" onclick="setFilter('RESOLVED')">Resolved</button>
        </div>
      </div>

      <div id="reportsContainer">Memuat data...</div>
    </div>
  </div>

</div>

<!-- Modal Update Progress -->
<div class="modal fade" id="updateModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="updateModalTitle">Update Progress Pekerjaan</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        <div class="mb-3">
          <label>Deskripsi Progress / Tindakan</label>
          <textarea id="progressNote" class="form-control" rows="3" placeholder="Jelaskan tindakan perbaikan yang dilakukan..." required></textarea>
        </div>
        <div class="mb-3">
          <label>Bukti Foto Baru</label>
          <div class="d-flex gap-2 mb-2">
            <button type="button" class="btn btn-outline-primary btn-sm w-50" onclick="triggerUpdateInput('camera')">📷 Kamera</button>
            <button type="button" class="btn btn-outline-secondary btn-sm w-50" onclick="triggerUpdateInput('gallery')">🖼️ Galeri</button>
          </div>
          <input type="file" id="updateCamera" class="d-none" accept="image/*" capture="environment">
          <input type="file" id="updateGallery" class="d-none" accept="image/*">
          <small id="updatePhotoStatus" class="text-muted d-block"></small>
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Batal</button>
        <button type="button" id="btnSaveUpdate" onclick="submitUpdateProgress()" class="btn btn-primary">Simpan Progress</button>
      </div>
    </div>
  </div>
</div>

<!-- Modal Full Image -->
<div class="modal fade" id="imageModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered modal-lg">
    <div class="modal-content">
      <div class="modal-header">
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body p-0">
        <img src="" id="fullImage" class="img-fluid w-100" alt="Full Image">
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
  const API_URL = "https://script.google.com/macros/s/AKfycbxYfqKB2SSDxPXGdwI5mqwivozqUi28DiLw2yS8Q5pHbwAdvEPL2xUbsq7mdE1RQ5wN/exec";
  
  let currentUser = JSON.parse(localStorage.getItem("user_civil")) || null;
  let selectedFile = null;
  let updateFile = null;
  let activeUpdateData = null;
  let allReports = [];
  let currentFilter = "ALL";

  const imageModal = new bootstrap.Modal(document.getElementById('imageModal'));
  const updateModal = new bootstrap.Modal(document.getElementById('updateModal'));
  const fullImageEl = document.getElementById('fullImage');

  if (currentUser) showApp();

  function showAuthCard(cardId) {
    document.getElementById("loginCard").classList.add("d-none");
    document.getElementById("registerCard").classList.add("d-none");
    document.getElementById("forgotCard").classList.add("d-none");
    document.getElementById(cardId).classList.remove("d-none");
  }

  // --- HANDLER LOGIN ---
  document.getElementById("loginForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    const btn = document.getElementById("btnLogin");
    btn.disabled = true; btn.innerText = "Memproses...";

    const res = await fetchAPI({
      action: "login",
      username: document.getElementById("loginUser").value,
      password: document.getElementById("loginPass").value
    });
    
    btn.disabled = false; btn.innerText = "Login";

    if (res.status === "success") {
      currentUser = res.user;
      localStorage.setItem("user_civil", JSON.stringify(currentUser));
      showApp();
    } else {
      alert(res.message);
    }
  });

  // --- HANDLER BUAT AKUN (REGISTER) ---
  document.getElementById("registerForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    const btn = document.getElementById("btnRegister");
    btn.disabled = true; btn.innerText = "Mendaftarkan...";

    const res = await fetchAPI({
      action: "register",
      fullname: document.getElementById("regFullname").value,
      username: document.getElementById("regUser").value,
      password: document.getElementById("regPass").value
    });

    btn.disabled = false; btn.innerText = "Daftar Akun";
    alert(res.message);

    if (res.status === "success") {
      document.getElementById("registerForm").reset();
      showAuthCard("loginCard");
    }
  });

  // --- HANDLER RESET PASSWORD ---
  document.getElementById("forgotForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    const btn = document.getElementById("btnForgot");
    btn.disabled = true; btn.innerText = "Memproses...";

    const res = await fetchAPI({
      action: "resetPassword",
      username: document.getElementById("forgotUser").value,
      newPassword: document.getElementById("forgotNewPass").value
    });

    btn.disabled = false; btn.innerText = "Ubah Password";
    alert(res.message);

    if (res.status === "success") {
      document.getElementById("forgotForm").reset();
      showAuthCard("loginCard");
    }
  });

  function showApp() {
    document.getElementById("authContainer").classList.add("d-none");
    document.getElementById("appSection").classList.remove("d-none");
    document.getElementById("userGreeting").innerText = "Halo, " + currentUser.name;
    loadReports();
  }

  function logout() {
    localStorage.removeItem("user_civil");
    location.reload();
  }

  function switchTab(tab) {
    if (tab === 'create') {
      document.getElementById("createTab").classList.remove("d-none");
      document.getElementById("listTab").classList.add("d-none");
      document.getElementById("tabCreate").classList.add("active");
      document.getElementById("tabList").classList.remove("active");
    } else {
      document.getElementById("createTab").classList.add("d-none");
      document.getElementById("listTab").classList.remove("d-none");
      document.getElementById("tabList").classList.add("active");
      document.getElementById("tabCreate").classList.remove("active");
      loadReports();
    }
  }

  function setFilter(status) {
    currentFilter = status;
    document.querySelectorAll('.filter-btn-group .btn').forEach(btn => {
      btn.classList.remove('active', 'btn-primary', 'btn-danger', 'btn-warning', 'btn-success');
      btn.classList.add('btn-outline-secondary');
    });

    if (status === 'ALL') document.getElementById('btnFilterAll').className = 'btn btn-primary active';
    else if (status === 'REPORTED') document.getElementById('btnFilterReported').className = 'btn btn-danger active';
    else if (status === 'PROGRESS') document.getElementById('btnFilterProgress').className = 'btn btn-warning text-dark active';
    else if (status === 'RESOLVED') document.getElementById('btnFilterResolved').className = 'btn btn-success active';

    renderReports();
  }

  function triggerFileInput(type) {
    if (type === 'camera') document.getElementById("photoCamera").click();
    else document.getElementById("photoGallery").click();
  }

  document.getElementById("photoCamera").addEventListener("change", (e) => handleFileSelect(e.target.files[0]));
  document.getElementById("photoGallery").addEventListener("change", (e) => handleFileSelect(e.target.files[0]));

  function handleFileSelect(file) {
    if (file) {
      selectedFile = file;
      document.getElementById("photoStatus").innerText = "Foto terpilih: " + file.name;
    }
  }

  function triggerUpdateInput(type) {
    if (type === 'camera') document.getElementById("updateCamera").click();
    else document.getElementById("updateGallery").click();
  }

  document.getElementById("updateCamera").addEventListener("change", (e) => { updateFile = e.target.files[0]; document.getElementById("updatePhotoStatus").innerText = "Foto terpilih: " + updateFile.name; });
  document.getElementById("updateGallery").addEventListener("change", (e) => { updateFile = e.target.files[0]; document.getElementById("updatePhotoStatus").innerText = "Foto terpilih: " + updateFile.name; });

  function applyWatermark(file, username, status, locationDetail) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.readAsDataURL(file);
      reader.onload = (event) => {
        const img = new Image();
        img.src = event.target.result;
        img.onload = () => {
          const canvas = document.createElement("canvas");
          canvas.width = img.width;
          canvas.height = img.height;
          const ctx = canvas.getContext("2d");

          ctx.drawImage(img, 0, 0);

          let statusText = "REPORTED";
          let badgeBgColor = "#dc3545";
          let badgeTextColor = "#FFFFFF";

          if (status === "PROGRESS") {
            statusText = "PROGRESS";
            badgeBgColor = "#ffc107";
            badgeTextColor = "#000000";
          } else if (status === "RESOLVED") {
            statusText = "RESOLVED";
            badgeBgColor = "#198754";
            badgeTextColor = "#FFFFFF";
          }

          const dateStr = new Date().toLocaleString("id-ID", { dateStyle: "medium", timeStyle: "short" });
          const lines = [
            `User: ${username}`,
            `Lokasi: ${locationDetail}`,
            `Waktu: ${dateStr}`
          ];

          const fontSize = Math.max(14, Math.round(img.width * 0.022));
          const padding = fontSize * 0.8;
          const lineHeight = fontSize * 1.35;

          ctx.font = `bold ${fontSize}px sans-serif`;

          let maxTextWidth = ctx.measureText(`STATUS: ${statusText}`).width;
          lines.forEach(line => {
            const w = ctx.measureText(line).width;
            if (w > maxTextWidth) maxTextWidth = w;
          });

          const boxWidth = maxTextWidth + (padding * 2);
          const boxHeight = (lines.length + 1) * lineHeight + (padding * 2);

          const startX = padding;
          const startY = img.height - boxHeight - padding;

          ctx.fillStyle = "rgba(0, 0, 0, 0.8)";
          ctx.fillRect(startX, startY, boxWidth, boxHeight);

          const badgeHeight = lineHeight + (padding * 0.4);
          ctx.fillStyle = badgeBgColor;
          ctx.fillRect(startX + (padding / 2), startY + (padding / 2), boxWidth - padding, badgeHeight);

          ctx.fillStyle = badgeTextColor;
          ctx.fillText(`STATUS: ${statusText}`, startX + padding, startY + (padding / 2) + fontSize);

          ctx.fillStyle = "#FFFFFF";
          lines.forEach((line, index) => {
            const textY = startY + badgeHeight + padding + ((index + 1) * lineHeight) - 4;
            ctx.fillText(line, startX + padding, textY);
          });

          resolve(canvas.toDataURL("image/jpeg", 0.85));
        };
      };
      reader.onerror = error => reject(error);
    });
  }

  document.getElementById("reportForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    if (!selectedFile) { alert("Pilih atau ambil foto laporan!"); return; }

    const btn = document.getElementById("btnSubmitReport");
    btn.disabled = true; btn.innerText = "Proses Watermark & Mengirim...";

    const locationDetail = document.getElementById("location_detail").value;
    const watermarkedBase64 = await applyWatermark(selectedFile, currentUser.username, "REPORTED", locationDetail);

    const payload = {
      action: "createReport",
      username: currentUser.username,
      floor: document.getElementById("floor").value,
      zone: document.getElementById("zone").value,
      area_type: document.getElementById("area_type").value,
      location_detail: locationDetail,
      issue: document.getElementById("issue").value,
      photo: watermarkedBase64
    };

    const res = await fetchAPI(payload);
    alert(res.message);
    btn.disabled = false; btn.innerText = "Kirim Laporan";

    if (res.status === "success") {
      document.getElementById("reportForm").reset();
      selectedFile = null;
      document.getElementById("photoStatus").innerText = "";
      switchTab('list');
    }
  });

  async function loadReports() {
    const container = document.getElementById("reportsContainer");
    container.innerHTML = "Memuat data...";
    const res = await fetchAPI({ action: "getReports" });
    
    if (res.status === "success") {
      allReports = res.data || [];
      renderReports();
    } else {
      container.innerHTML = "<div class='text-center text-danger py-4'>Gagal memuat data.</div>";
    }
  }

  function renderReports() {
    const container = document.getElementById("reportsContainer");
    container.innerHTML = "";

    const filtered = allReports.filter(item => {
      if (currentFilter === "ALL") return true;
      return item.status === currentFilter;
    });

    if (filtered.length === 0) {
      container.innerHTML = `<div class='text-center text-muted py-4'>Tidak ada laporan dengan status <strong>${currentFilter}</strong>.</div>`;
      return;
    }

    filtered.forEach(item => {
      const photoReportThumbnail = getGoogleThumbnailUrl(item.photo_report);
      const photoProgressThumbnail = getGoogleThumbnailUrl(item.photo_progress);
      const photoResolvedThumbnail = getGoogleThumbnailUrl(item.photo_resolved);

      container.innerHTML += `
        <div class="card card-report status-${item.status} p-3 shadow-sm">
          <div class="d-flex justify-content-between align-items-center">
            <span class="badge bg-secondary">${item.floor} - ${item.zone} (${item.area_type})</span>
            <span class="badge bg-${getStatusColor(item.status)}">${item.status}</span>
          </div>
          <p class="mt-2 mb-1"><strong>${item.location_detail}</strong></p>
          <p class="text-muted small mb-1">${item.issue}</p>
          ${item.progress_note ? `<p class="small text-primary mb-2"><strong>Progress Note:</strong> ${item.progress_note}</p>` : ''}
          
          <div class="row g-2 mb-2">
            ${photoReportThumbnail ? `
              <div class="col">
                <small class="d-block text-muted">Report:</small>
                <img src="${photoReportThumbnail}" class="img-preview" onclick="viewFullImage('${item.photo_report}')">
              </div>` : ''}
            ${photoProgressThumbnail ? `
              <div class="col">
                <small class="d-block text-muted">Progress:</small>
                <img src="${photoProgressThumbnail}" class="img-preview" onclick="viewFullImage('${item.photo_progress}')">
              </div>` : ''}
            ${photoResolvedThumbnail ? `
              <div class="col">
                <small class="d-block text-muted">Resolved:</small>
                <img src="${photoResolvedThumbnail}" class="img-preview" onclick="viewFullImage('${item.photo_resolved}')">
              </div>` : ''}
          </div>

          <div class="d-flex gap-2 mt-2">
            ${item.status === 'REPORTED' ? `<button onclick="openUpdateModal('${item.id}', 'PROGRESS', '${item.location_detail}')" class="btn btn-sm btn-warning">Kerjakan (Progress)</button>` : ''}
            ${item.status === 'PROGRESS' ? `<button onclick="openUpdateModal('${item.id}', 'RESOLVED', '${item.location_detail}')" class="btn btn-sm btn-success">Selesai (Resolved)</button>` : ''}
            <button onclick="toggleComments('${item.id}')" class="btn btn-sm btn-outline-primary">Komentar</button>
          </div>

          <div id="comments-${item.id}" class="mt-3 d-none border-top pt-2">
            <h6>Komentar:</h6>
            <div id="commentList-${item.id}" class="small text-muted mb-2">Memuat...</div>
            <div class="input-group input-group-sm">
              <input type="text" id="inputComment-${item.id}" class="form-control" placeholder="Tulis komentar...">
              <button onclick="sendComment('${item.id}')" class="btn btn-primary">Kirim</button>
            </div>
          </div>
        </div>
      `;
    });
  }

  function openUpdateModal(id, targetStatus, locationDetail) {
    activeUpdateData = { id, targetStatus, locationDetail };
    updateFile = null;
    document.getElementById("progressNote").value = "";
    document.getElementById("updatePhotoStatus").innerText = "";
    document.getElementById("updateModalTitle").innerText = targetStatus === "PROGRESS" ? "Update Ke Status PROGRESS" : "Update Ke Status RESOLVED";
    updateModal.show();
  }

  async function submitUpdateProgress() {
    const note = document.getElementById("progressNote").value;
    if (!note) { alert("Isi deskripsi progress perbaikan!"); return; }
    if (!updateFile) { alert("Ambil/pilih foto bukti perbaikan!"); return; }

    const btn = document.getElementById("btnSaveUpdate");
    btn.disabled = true;

    const watermarkedBase64 = await applyWatermark(updateFile, currentUser.username, activeUpdateData.targetStatus, activeUpdateData.locationDetail);

    const res = await fetchAPI({
      action: "updateProgress",
      report_id: activeUpdateData.id,
      new_status: activeUpdateData.targetStatus,
      progress_note: note,
      photo: watermarkedBase64
    });

    alert(res.message);
    btn.disabled = false;
    updateModal.hide();
    loadReports();
  }

  function getGoogleThumbnailUrl(driveUrl) {
    if (!driveUrl) return "";
    let fileId = "";
    if (driveUrl.includes('open?id=')) {
      fileId = driveUrl.split('open?id=')[1].split('&')[0];
    } else if (driveUrl.includes('/file/d/')) {
      fileId = driveUrl.split('/file/d/')[1].split('/')[0];
    }
    if (fileId) {
      return `https://drive.google.com/thumbnail?id=${fileId}&w=600&sz=w600`;
    }
    return driveUrl;
  }

  function viewFullImage(driveUrl) {
    if (!driveUrl) return;
    let fileId = "";
    if (driveUrl.includes('open?id=')) {
      fileId = driveUrl.split('open?id=')[1].split('&')[0];
    } else if (driveUrl.includes('/file/d/')) {
      fileId = driveUrl.split('/file/d/')[1].split('/')[0];
    }
    if (fileId) {
      fullImageEl.src = `https://drive.google.com/thumbnail?id=${fileId}&w=1600&sz=w1600`;
    } else {
      fullImageEl.src = driveUrl;
    }
    imageModal.show();
  }

  async function toggleComments(id) {
    const el = document.getElementById(`comments-${id}`);
    el.classList.toggle("d-none");
    if (!el.classList.contains("d-none")) {
      const res = await fetchAPI({ action: "getComments", report_id: id });
      const list = document.getElementById(`commentList-${id}`);
      list.innerHTML = "";
      if (!res.data || res.data.length === 0) {
        list.innerHTML = "Belum ada komentar.";
      } else {
        res.data.forEach(c => {
          list.innerHTML += `<div><strong>${c.username}:</strong> ${c.comment}</div>`;
        });
      }
    }
  }

  async function sendComment(id) {
    const comment = document.getElementById(`inputComment-${id}`).value;
    if (!comment) return;
    await fetchAPI({ action: "addComment", report_id: id, username: currentUser.username, comment: comment });
    document.getElementById(`inputComment-${id}`).value = "";
    toggleComments(id);
  }

  function getStatusColor(status) {
    if (status === 'REPORTED') return 'danger';
    if (status === 'PROGRESS') return 'warning';
    if (status === 'RESOLVED') return 'success';
    return 'secondary';
  }

  function fetchAPI(body) {
    return fetch(API_URL, { method: "POST", body: JSON.stringify(body) }).then(r => r.json());
  }
</script>
</body>
</html>
